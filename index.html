
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Wishes 🎂</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 .birthday-video {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* ==========================================
       BODY
    ========================================== */

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(
        135deg,
        #fce4ec,
        #ffe0b2
      );

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;

      overflow: hidden;
    }


    /* ==========================================
       BACKGROUND VIDEO
    ========================================== */

    .birthday-video {
      position: fixed;

      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      z-index: -2;

      pointer-events: none;
    }


    /* Dark transparent layer over video */

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      background: rgba(0, 0, 0, 0.15);

      z-index: -1;

      pointer-events: none;
    }


    /* ==========================================
       BOOK CONTAINER
    ========================================== */

    .container {
      position: relative;

      width: 340px;

      height: 590px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      z-index: 10;
    }


    /* ==========================================
       BOOK
    ========================================== */

    .book {
      position: relative;

      width: 340px;

      height: 420px;

      perspective: 1200px;
    }


    /* ==========================================
       CARD
    ========================================== */

    .page {
      position: absolute;

      width: 100%;
      height: 420px;

      background-size: cover;

      background-position: center;

      background-repeat: no-repeat;

      border-radius: 12px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.25);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      backface-visibility: hidden;

      transition:
        transform 0.7s ease,
        z-index 0s 0.7s;

      transform-origin: left center;

      cursor: pointer;

      overflow: hidden;
    }


    /* ==========================================
       IMAGE OVERLAY
    ========================================== */

    .page::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        rgba(255, 255, 255, 0.12);

      border-radius: 12px;

      z-index: 0;

      pointer-events: none;
    }


    /* ==========================================
       FLIPPED CARD
    ========================================== */

    .page.flipped {
      transform: rotateY(-180deg);

      z-index: 1;
    }


    /* ==========================================
       HINT
    ========================================== */

    .hint {
      position: absolute;

      top: 10px;
      left: 10px;

      color: white;

      font-size: 0.7rem;

      background:
        rgba(0, 0, 0, 0.35);

      padding: 4px 8px;

      border-radius: 10px;

      z-index: 2;
    }


    /* ==========================================
       PAGE NUMBER
    ========================================== */

    .page-number {
      position: absolute;

      bottom: 15px;
      right: 20px;

      font-size: 0.8rem;

      color: white;

      background:
        rgba(0, 0, 0, 0.4);

      padding: 4px 8px;

      border-radius: 10px;

      z-index: 2;
    }


    /* ==========================================
       WISH OUTSIDE CARD
    ========================================== */

    .wish-display {

      width: 340px;

      min-height: 90px;

      margin-top: 18px;

      padding: 12px 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      color: white;

      font-size: 1.15rem;

      font-weight: 600;

      line-height: 1.5;

      background:
        rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(5px);

      border-radius: 15px;

      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.2);

      transition:
        opacity 0.3s ease;

      z-index: 20;
    }


    /* ==========================================
       CONTROLS
    ========================================== */

    .controls {

      margin-top: 15px;

      display: flex;

      gap: 15px;

      z-index: 30;
    }


    .controls button {

      background:
        linear-gradient(
          135deg,
          #ff6b6b,
          #ff4081
        );

      color: white;

      border: none;

      padding: 10px 22px;

      border-radius: 30px;

      cursor: pointer;

      font-size: 0.95rem;

      font-weight: 600;

      box-shadow:
        0 5px 15px rgba(0, 0, 0, 0.2);

      transition: 0.2s;
    }


    .controls button:hover {

      transform:
        translateY(-2px);

      background:
        linear-gradient(
          135deg,
          #e55a5a,
          #e91e63
        );
    }


    .controls button:active {

      transform:
        scale(0.95);
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 500px) {

      .container {

        width: 90vw;

        height: 560px;
      }


      .book {

        width: 90vw;

        height: 350px;
      }


      .page {

        width: 90vw;

        height: 350px;
      }


      .wish-display {

        width: 90vw;

        min-height: 80px;

        font-size: 1rem;

        margin-top: 15px;

        padding: 10px 12px;
      }


      .controls {

        gap: 10px;

        margin-top: 12px;
      }


      .controls button {

        padding:
          9px 15px;

        font-size:
          0.85rem;
      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       BACKGROUND VIDEO
  ========================================== -->

    <!-- 🎥 VIDEO -->
  <video class="birthday-video" autoplay muted loop playsinline controls>

    <source src="Timeline 1.mov" type="video/mp4">

    Your browser does not support the video tag.

  </video>


  <!-- ==========================================
       AUDIO
  ========================================== -->

  <audio
    id="birthdayAudio"
    loop>

    <source
      src="song.mp3"
      type="audio/mpeg">

    Your browser does not support the audio element.

  </audio>


  <!-- ==========================================
       MAIN CONTAINER
  ========================================== -->

  <div class="container">


    <!-- ========================================
         FLIPBOOK
    ========================================= -->

    <div
      class="book"
      id="book">

      <!-- Pages generated by JavaScript -->

    </div>


    <!-- ========================================
         SINGLE WISH DISPLAY
         This is OUTSIDE the cards.
    ========================================= -->

    <div
      class="wish-display"
      id="wishDisplay">

      Happy Birthday! May your day be as sweet as you!

    </div>


    <!-- ========================================
         CONTROLS
    ========================================= -->

    <div class="controls">

      <button onclick="prevPage()">
        ⬅ Previous
      </button>

      <button onclick="nextPage()">
        Next ➡
      </button>

    </div>

  </div>


  <script>


    /* ==========================================
       WISHES AND IMAGES
    ========================================== */

    const wishes = [

      {
        text:
          'Happy Birthday! May your day be as sweet as you!',

        image:
          'image copy 3.png'
      },


      {
        text:
          'Wishing you endless joy and laughter!',

        image:
          'image.png'
      },


      {
        text:
          'May all your dreams come true this year!',

        image:
          'image copy 4.png'
      },


      {
        text:
          'Another year, another adventure – enjoy every moment!',

        image:
          'image copy 2.png'
      },


      {
        text:
          'You deserve all the love and happiness today!',

        image:
          'image copy 5.png'
      },


      {
        text:
          'Stay cute, stay blessed – Happy Birthday!',

        image:
          'image copy 6.png'
      }

    ];


    /* ==========================================
       GET ELEMENTS
    ========================================== */

    const book =
      document.getElementById('book');

    const wishDisplay =
      document.getElementById('wishDisplay');

    const birthdayAudio =
      document.getElementById('birthdayAudio');


    /* ==========================================
       BUILD CARDS
    ========================================== */

    wishes.forEach((w, i) => {


      const page =
        document.createElement('div');


      page.className =
        'page' +
        (i === 0
          ? ''
          : ' flipped');


      page.dataset.index = i;


      /* Background image */

      page.style.backgroundImage =
        `url("${w.image}")`;


      /* Card content */

      page.innerHTML = `

        <div class="hint">
          Click to flip
        </div>

        <div class="page-number">
          ${i + 1} / ${wishes.length}
        </div>

      `;


      /* ========================================
         CARD CLICK
      ======================================== */

      page.addEventListener(
        'click',
        function(e) {


          e.stopPropagation();


          page.classList.toggle(
            'flipped'
          );


          /*
            Start music after user
            interacts with the page.
          */

          birthdayAudio.play()
            .catch(() => {});


        }
      );


      book.appendChild(page);

    });


    /* ==========================================
       PAGE NAVIGATION
    ========================================== */

    let currentPage = 0;


    const pages =
      document.querySelectorAll('.page');


    /* ==========================================
       UPDATE WISH
    ========================================== */

    function updateWish() {


      wishDisplay.style.opacity = '0';


      setTimeout(() => {


        wishDisplay.textContent =
          wishes[currentPage].text;


        wishDisplay.style.opacity =
          '1';


      }, 150);

    }


    /* ==========================================
       GO TO PAGE
    ========================================== */

    function goToPage(index) {


      if (
        index < 0 ||
        index >= pages.length
      ) {

        return;

      }


      pages.forEach(
        (page, i) => {


          if (i <= index) {

            page.classList.remove(
              'flipped'
            );

          } else {

            page.classList.add(
              'flipped'
            );

          }

        }
      );


      currentPage = index;


      /* Update text below card */

      updateWish();

    }


    /* ==========================================
       NEXT PAGE
    ========================================== */

    function nextPage() {


      if (
        currentPage <
        pages.length - 1
      ) {


        goToPage(
          currentPage + 1
        );


        birthdayAudio.play()
          .catch(() => {});

      }

    }


    /* ==========================================
       PREVIOUS PAGE
    ========================================== */

    function prevPage() {


      if (
        currentPage > 0
      ) {


        goToPage(
          currentPage - 1
        );


        birthdayAudio.play()
          .catch(() => {});

      }

    }


    /* ==========================================
       KEYBOARD SUPPORT
    ========================================== */

    document.addEventListener(
      'keydown',
      function(event) {


        if (
          event.key === 'ArrowRight'
        ) {

          nextPage();

        }


        if (
          event.key === 'ArrowLeft'
        ) {

          prevPage();

        }

      }
    );


    /* ==========================================
       START
    ========================================== */

    goToPage(0);


  </script>


</body>

</html>
