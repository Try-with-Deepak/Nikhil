<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday whishes 🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .birthday-video {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: linear-gradient(135deg,
          #fce4ec,
          #ffe0b2);

      font-family:
        'Segoe UI',
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    }

    .book {
      position: relative;

      width: 340px;
      height: 520px;

      perspective: 1200px;
    }

    /* ==========================================
       CARD
    ========================================== */

    .page {
      position: absolute;

      width: 100%;
      height: 420px;

      /* Background image */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      border-radius: 12px;

      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.15);

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      backface-visibility: hidden;

      transition:
        transform 0.7s ease,
        z-index 0s 0.7s;

      transform-origin: left center;

      cursor: pointer;

      overflow: hidden;
    }

    /* Light image overlay */
    .page::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        rgba(255, 255, 255, 0.20);

      border-radius: 12px;

      z-index: 0;

      pointer-events: none;
    }

    /* Keep hint and number above image */
    .page>* {
      position: relative;
      z-index: 1;
    }

    /* ==========================================
       FLIP
    ========================================== */

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 1;
    }

    /* ==========================================
       WISH TEXT
       NOW BELOW THE CARD
    ========================================== */

    .wish-text {
      position: absolute;

      top: 440px;

      left: 0;

      width: 100%;

      font-size: 1.2rem;

      color: #333;

      text-align: center;

      line-height: 1.6;

      padding: 10px 15px;

      background: transparent;

      border-radius: 12px;

      font-weight: 600;

      opacity: 0;

      animation: fadeIn 0.5s forwards;

      pointer-events: none;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    /* ==========================================
       PAGE NUMBER
    ========================================== */

    .page-number {
      position: absolute;

      bottom: 15px;
      right: 20px;

      font-size: 0.8rem;

      color: white;

      background:
        rgba(0, 0, 0, 0.35);

      padding: 4px 8px;

      border-radius: 10px;
    }

    /* ==========================================
       HINT
    ========================================== */

    .hint {
      position: absolute;

      top: 10px;
      left: 10px;

      color: white;

      font-size: 0.7rem;

      background:
        rgba(0, 0, 0, 0.3);

      padding: 4px 8px;

      border-radius: 10px;
    }

    /* ==========================================
       CONTROLS
    ========================================== */

    .controls {
      position: absolute;

      bottom: 0;

      left: 50%;

      transform: translateX(-50%);

      display: flex;

      gap: 20px;

      z-index: 1000;
    }

    .controls button {
      background: #ff6b6b;

      color: white;

      border: none;

      padding: 10px 24px;

      border-radius: 30px;

      cursor: pointer;

      font-size: 1rem;

      transition: 0.2s;
    }

    .controls button:hover {
      background: #e55a5a;
    }

    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 500px) {

      .book {
        width: 90vw;
        height: 510px;
      }

      .page {
        height: 420px;
      }

      .wish-text {
        top: 440px;

        font-size: 1rem;

        padding:
          8px 10px;
      }

      .controls {
        gap: 10px;
      }

      .controls button {
        padding:
          9px 17px;

        font-size:
          0.85rem;
      }
    }


  </style>
</head>

<body>

  <!-- 🎥 VIDEO -->
  <video class="birthday-video" autoplay muted loop playsinline controls>

    <source src="vdo.mp4" type="video/mp4">

    Your browser does not support the video tag.

  </video>

  <div class="book" id="book">
    <!-- Pages generated by JS -->
  </div>


  <div class="controls">

    <button onclick="prevPage()">
      ⬅ Previous
    </button>

    <button onclick="nextPage()">
      Next ➡
    </button>

  </div>


  <script>

    // ==========================================
    // YOUR IMAGES AND WISHES
    // ==========================================

    const wishes = [

      {
        text:
          'Happy Birthday! May your day be as sweet as you!',

        image:
          'image copy 3.png'
      },

      {
        text:
          'Wishing you endless joy and laughter!',

        image:
          'image.png'
      },

      {
        text:
          'May all your dreams come true this year!',

        image:
          'image copy 4.png'
      },

      {
        text:
          'Another year, another adventure – enjoy every moment!',

        image:
          'image copy 2.png'
      },

      {
        text:
          'You deserve all the love and happiness today!',

        image:
          'image copy 5.png'
      },

      {
        text:
          'Stay cute, stay blessed – Happy Birthday!',

        image:
          'image copy 6.png'
      }

    ];


    // ==========================================
    // BUILD PAGES
    // ==========================================

    const book =
      document.getElementById('book');


    wishes.forEach((w, i) => {

      const page =
        document.createElement('div');


      page.className =
        'page' +
        (i === 0 ? '' : ' flipped');


      page.dataset.index = i;


      // Set card background image

      page.style.backgroundImage =
        `url("${w.image}")`;


      page.innerHTML = `

        <div class="hint">
          Click to flip
        </div>


        <div class="wish-text">
          ${w.text}
        </div>


        <div class="page-number">
          ${i + 1} / ${wishes.length}
        </div>

      `;


      // ==========================================
      // CLICK CARD TO FLIP
      // ==========================================

      page.addEventListener(
        'click',
        (e) => {

          e.stopPropagation();

          page.classList.toggle(
            'flipped'
          );

        }
      );


      book.appendChild(page);

    });


    // ==========================================
    // NAVIGATION
    // ==========================================

    let currentPage = 0;


    const pages =
      document.querySelectorAll('.page');


    function goToPage(index) {

      if (
        index < 0 ||
        index >= pages.length
      ) {

        return;

      }


      pages.forEach(
        (page, i) => {

          if (i <= index) {

            page.classList.remove(
              'flipped'
            );

          } else {

            page.classList.add(
              'flipped'
            );

          }

        }
      );


      currentPage = index;

    }


    // ==========================================
    // NEXT
    // ==========================================

    function nextPage() {

      goToPage(

        Math.min(
          currentPage + 1,
          pages.length - 1
        )

      );

    }


    // ==========================================
    // PREVIOUS
    // ==========================================

    function prevPage() {

      goToPage(

        Math.max(
          currentPage - 1,
          0
        )

      );

    }


    // ==========================================
    // START
    // ==========================================

    goToPage(0);

  </script>

</body>

</html>
