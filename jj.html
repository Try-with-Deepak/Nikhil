<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Flipbook 🎂</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fce4ec, #ffe0b2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .book {
      position: relative;
      width: 340px;
      height: 420px;
      perspective: 1200px;
    }

    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backface-visibility: hidden;
      transition: transform 0.7s ease, z-index 0s 0.7s;
      transform-origin: left center;
      cursor: pointer;
    }

    .page:nth-child(odd) {
      background: #fff5f5;
      border: 2px solid #ffd0d0;
    }

    .page:nth-child(even) {
      background: #fff0f6;
      border: 2px solid #f8c8d8;
    }

    .page.flipped {
      transform: rotateY(-180deg);
      z-index: 1;
    }

    .teddy {
      font-size: 5rem;
      margin-bottom: 15px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    .wish-text {
      font-size: 1.2rem;
      color: #333;
      text-align: center;
      line-height: 1.6;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .page-number {
      position: absolute;
      bottom: 15px;
      right: 20px;
      font-size: 0.8rem;
      color: #aaa;
    }

    .controls {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }

    .controls button {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    .controls button:hover {
      background: #e55a5a;
    }

    .hint {
      position: absolute;
      top: 10px;
      left: 10px;
      color: #ccc;
      font-size: 0.7rem;
    }

    .card-image {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 3px solid #ffb3b3;
    }
  </style>
</head>
<body>
  <div class="book" id="book">
    <!-- Pages generated by JS -->
  </div>
  <div class="controls">
    <button onclick="prevPage()">⬅ Previous</button>
    <button onclick="nextPage()">Next ➡</button>
  </div>

  <script>
    // ─── Data ────────────────────────────────────────────
    const wishes = [
      { teddy: '🧸', text: 'Happy Birthday! 🎉 May your day be as sweet as you!', image: 'image.png' },
      { teddy: '🐻', text: 'Wishing you endless joy and laughter! 🎈', image: 'https://images.unsplash.com/photo-1545696563-af8f6ec2295a?w=200&h=200&fit=crop' }, // birthday cake image
      { teddy: '🐼', text: 'May all your dreams come true this year! 🌟', image: '' },
      { teddy: '🐨', text: 'Another year, another adventure – enjoy every moment! 🎊', image: '' },
      { teddy: '🦊', text: 'You deserve all the love and happiness today! 💖', image: '' },
      { teddy: '🐰', text: 'Stay cute, stay blessed – Happy Birthday! 🧸', image: '' },
      { teddy: '🐱', text: 'Cheers to you – the world is better with you in it! 🎂', image: '' }
    ];

    // ─── Build pages ─────────────────────────────────────
    const book = document.getElementById('book');
    wishes.forEach((w, i) => {
      const page = document.createElement('div');
      page.className = 'page' + (i === 0 ? '' : ' flipped');
      page.dataset.index = i;
      let imageHtml = '';
      if (w.image) {
        imageHtml = `<img src="${w.image}" alt="Birthday image" class="card-image">`;
      }
      page.innerHTML = `
        <div class="hint">Click to flip</div>
        <div class="teddy">${w.teddy}</div>
        ${imageHtml}
        <div class="wish-text">${w.text}</div>
        <div class="page-number">${i + 1} / ${wishes.length}</div>
      `;
      // Click to toggle flip
      page.addEventListener('click', (e) => {
        e.stopPropagation();
        page.classList.toggle('flipped');
      });
      book.appendChild(page);
    });

    // ─── Navigation ──────────────────────────────────────
    let currentPage = 0;
    const pages = document.querySelectorAll('.page');

    function goToPage(index) {
      if (index < 0 || index >= pages.length) return;
      pages.forEach((page, i) => {
        if (i <= index) {
          page.classList.remove('flipped');
        } else {
          page.classList.add('flipped');
        }
      });
      currentPage = index;
    }

    function nextPage() {
      goToPage(Math.min(currentPage + 1, pages.length - 1));
    }

    function prevPage() {
      goToPage(Math.max(currentPage - 1, 0));
    }

    // Start at first page
    goToPage(0);
  </script>
</body>
</html>
